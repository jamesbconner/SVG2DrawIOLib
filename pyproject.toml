[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SVG2DrawIOLib"
description = 'Generate DrawIO shape libraries from SVGs'
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = [
  "draw.io",
  "drawio",
  "svg",
  "diagrams",
  "icons",
  "shapes",
  "architecture",
  "technical stack",
  "tech stack"
  ]
authors = [
  { name = "James Conner", email = "jamesbconner@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "click>=8.1.0",
  "rich>=13.0.0",
  "rich-click>=1.8.0",
  "svgelements>=1.9.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2",
  "pytest-cov>=6.0.0",
  "ruff>=0.14.4",
  "mypy>=1.18.0",
  "bandit>=1.7.0",
  "pre-commit>=4.4.0",
  "twine>=5.0.0",
  "pip>=26.0.1",
  "uv>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/jamesbconner/SVG2DrawIOLib"
Documentation = "https://github.com/jamesbconner/SVG2DrawIOLib#readme"
Repository = "https://github.com/jamesbconner/SVG2DrawIOLib"
Issues = "https://github.com/jamesbconner/SVG2DrawIOLib/issues"
Changelog = "https://github.com/jamesbconner/SVG2DrawIOLib/blob/main/CHANGELOG.md"

[project.scripts]
SVG2DrawIOLib = "SVG2DrawIOLib.cli:cli"

[tool.hatch.version]
path = "src/SVG2DrawIOLib/__about__.py"

[tool.hatch.envs.default]
dependencies = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "bandit>=1.7.0",
  "pre-commit>=3.0.0",
]
[tool.hatch.envs.default.scripts]
test = "pytest {args}"
cov = "pytest --cov-report=term-missing --cov-config=pyproject.toml --cov=src/SVG2DrawIOLib --cov=tests {args}"
lint = "ruff check src tests"
format = "ruff format src tests"
type = "mypy src"
security = "bandit -r src"
all = ["format", "lint", "type", "security", "cov"]

[[tool.hatch.envs.test.matrix]]
python = ["313", "314"]

[tool.coverage.run]
branch = true
parallel = true
omit = [
  "src/SVG2DrawIOLib/__about__.py",
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG", # flake8-unused-arguments
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "S101"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rich_click.*"
ignore_missing_imports = true
